[core]
backend=drm-backend.so
require-input=false
idle-time=0
modules=systemd-notify.so

[output]
name=DP-1
mode=1920x1080@60
transform=normal

[shell]
panel-position=none
locking=false
background-color=0xff000000

[libinput]
enable-tap=true

[keyboard]
keymap_layout=us

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize
